# Gated GitHub issues -> pm tracker sync. The audited pipeline lives in pm-github;
# this caller only owns the schedule. Requires Settings -> Actions -> "Allow GitHub
# Actions to create and approve pull requests" (enabled by the orchestrator).
name: Sync GitHub issues into pm
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write
jobs:
  gated-sync:
    if: github.repository == 'unbraind/pm-memory'
    uses: unbraind/pm-github/.github/workflows/pm-github-sync.yml@549f8d26656d124c93b7ef8d09a005e7cae6f4f7 # pm-github 2026.10.30
    with:
      pm-github-version: "2026.10.19"
